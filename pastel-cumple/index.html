<script>
/* ✏️ PERSONALIZA AQUÍ — o por el link: ?para=Ana&msg=...&de=...&velas=5 */
const q = new URLSearchParams(location.search);
const EN = q.get('lang') === 'en';   // ?lang=en → textos en inglés (cuenta de TikTok en inglés)
const CONFIG = {
  para:    q.get('para') || (EN ? "Zoe" : "Camila"),
  mensaje: q.get('msg')  || (EN ? "May this year bring you everything you wished for. My wish already came true: you." : "Que este año te traiga todo lo que deseaste al soplar. Yo ya tengo mi deseo cumplido: tú."),
  firma:   q.get('de')   || (EN ? "Love you, Nick 🎂" : "Te quiere, Nico 🎂"),
  velas:   Math.min(9, Math.max(1, parseInt(q.get('velas')) || 5))
};
const VIDEO = q.has('video');
const $ = id => document.getElementById(id);
$('para').textContent = CONFIG.para;
if (EN) { $('feliz').textContent = 'HAPPY BIRTHDAY!'; $('pista').textContent = 'Make a wish… and blow (or tap) 🌬️'; $('mic').textContent = '🎤 Blow for real'; }
else $('pista').textContent = 'Pide un deseo… y sopla (o toca) 🌬️';
const TXG = EN ? { globos: 'Pop the balloons! 🎈', oye: '🎤 Blow at your phone…', sinMic: 'No microphone: tap to blow 🌬️' }
               : { globos: '¡Revienta los globos! 🎈', oye: '🎤 Sopla a tu celular…', sinMic: 'Sin micrófono: toca para soplar 🌬️' };

const cv = $('c'), ctx = cv.getContext('2d');
let W, H;
function medir() { const d = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
medir(); addEventListener('resize', medir);
const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);
const easeOut = t => 1 - Math.pow(1 - t, 3);

const luces = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), r: 20 + Math.random() * 60, h: [330, 45, 280, 190][(Math.random() * 4) | 0], f: Math.random() * 6 }));
const chispas = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random(), f: Math.random() * 6 }));
const confeti = [], humo = [];
const T_PASTEL = 300, T_VELAS = 1500, T_NOMBRE = 2300, T_PISTA = 3300;
/* ---------- soplar de verdad: el micrófono se escucha solo en el celular, no se graba ni se envía ---------- */
let micActivo = false, micNegado = false, analizador = null, datosMic = null, flujo = null;
async function pedirMic() {
  try {
    flujo = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(flujo); analizador = ac.createAnalyser(); analizador.fftSize = 512;
    src.connect(analizador); datosMic = new Uint8Array(analizador.fftSize);
    micActivo = true; $('mic').classList.add('oye'); $('mic').textContent = TXG.oye; $('nivel').classList.add('ver');
  } catch (e) { micNegado = true; $('mic').classList.remove('ver'); $('pista').textContent = TXG.sinMic; }
}
function pararMic() { if (flujo) flujo.getTracks().forEach(tr => tr.stop()); micActivo = false; }
function escucharMic(t) {
  if (!micActivo || tSoplo !== null) return;
  analizador.getByteTimeDomainData(datosMic);
  let suma = 0; for (const v of datosMic) { const x = (v - 128) / 128; suma += x * x; }
  const nivel = Math.sqrt(suma / datosMic.length);            // soplar al micrófono da un ruido fuerte y parejo
  $('nivel').firstElementChild.style.width = Math.min(100, nivel * 400) + '%';
  if (nivel > .12) { viento = Math.max(viento, nivel * 5); energia += nivel; if (energia > 2.2) { energia = 0; apagarAlgunas(1, t); } }
  else energia = Math.max(0, energia - .05);
}
$('mic').addEventListener('click', e => { e.stopPropagation(); if (!micActivo) pedirMic(); });

/* ---------- globos para reventar ---------- */
const globos = [];
function soltarGlobos() {
  const cols = ['#ff4d8d', '#ffd36b', '#6ad1ff', '#9dff8a', '#c69cff', '#ff8fb8', '#ffa36b'];
  for (let i = 0; i < 7; i++) globos.push({ x: W * (.1 + i * .13) + (Math.random() - .5) * 20, y: H + 20 + Math.random() * 110, v: 1.3 + Math.random() * .6, r: 24 + Math.random() * 8, c: cols[i], f: Math.random() * 6, roto: null });
}
function globoXY(g, t) { return { x: g.x + Math.sin(t / 700 + g.f) * 12, y: g.y }; }
function reventar(x, y) {
  for (const g of globos) {
    if (g.roto) continue;
    const p = globoXY(g, ahora);
    if (Math.hypot(x - p.x, y - p.y) < g.r * 1.4) {
      g.roto = ahora; K.vibrar(30);
      for (let i = 0; i < 40; i++) { const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5;
        confeti.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: i % 2 ? g.c : '#fff', r: Math.random() * 6, n: ahora, vida: 1400 + Math.random() * 800 }); }
      return;
    }
  }
}
function pintarGlobos(t) {
  for (const g of globos) {
    if (g.roto) continue;
    g.y -= g.v; if (g.y < -80) { g.y = H + 60; }
    const { x, y } = globoXY(g, t);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y + g.r * 1.2);
    ctx.quadraticCurveTo(x + Math.sin(t / 300 + g.f) * 8, y + g.r * 2, x, y + g.r * 3); ctx.stroke();
    const gr = ctx.createRadialGradient(x - g.r * .35, y - g.r * .4, 2, x, y, g.r * 1.3);
    gr.addColorStop(0, '#fff'); gr.addColorStop(.25, g.c); gr.addColorStop(1, g.c);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(x, y, g.r, g.r * 1.2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = g.c; ctx.beginPath(); ctx.moveTo(x - 4, y + g.r * 1.22); ctx.lineTo(x + 4, y + g.r * 1.22); ctx.lineTo(x, y + g.r * 1.12); ctx.fill();
  }
}
/* ---------- video: 3 soplidos (toques) y luego revienta 2 globos ---------- */
const enPastel = () => ({ x: W / 2 + 12, y: H * .47 });
const globoVivo = k => () => { const vivos = globos.filter(g => !g.roto && g.y < H * .85 && g.y > H * .2); const g = vivos[k % Math.max(vivos.length, 1)]; return g ? globoXY(g, ahora) : { x: W / 2, y: H * .5 }; };
const guion = K.guion([
  { viaje: 800, cuando: () => T_PISTA + 1400, donde: enPastel },
  { viaje: 300, cuando: () => apagadas.filter(v => v != null).length ? ahora + 700 : null, donde: enPastel },
  { viaje: 300, cuando: () => tSoplo === null && apagadas.filter(v => v != null).length > CONFIG.velas / 2 ? ahora + 700 : null, donde: enPastel },
  { viaje: 600, cuando: () => globos.some(g => g.y < H * .7) ? ahora + 300 : null, donde: globoVivo(0) },
  { viaje: 500, cuando: () => globos.some(g => g.roto) ? ahora + 500 : null, donde: globoVivo(1) }
], { abajo: (x, y) => { if (tSoplo === null) puff(ahora); else reventar(x, y); } });
let tSoplo = null, t0 = null, ahora = 0;

function rect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function dibujarPastel(t) {
  const cx = W / 2, base = H * .6, ancho = Math.min(W * .62, 300);
  const p = easeOut(clamp((t - T_PASTEL) / 900));
  const sube = (1 - p) * 60;
  ctx.save(); ctx.globalAlpha = p; ctx.translate(0, sube);
  // plato
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.ellipse(cx, base + 6, ancho * .62, 14, 0, 0, 7); ctx.fill();
  // pisos
  const pisos = [{ w: ancho, h: 70, c1: '#ff8fb8', c2: '#e85d92' }, { w: ancho * .74, h: 58, c1: '#ffd6e6', c2: '#f3a9c6' }];
  let y = base;
  pisos.forEach((pz, i) => {
    y -= pz.h;
    const g = ctx.createLinearGradient(cx - pz.w / 2, 0, cx + pz.w / 2, 0);
    g.addColorStop(0, pz.c2); g.addColorStop(.5, pz.c1); g.addColorStop(1, pz.c2);
    ctx.fillStyle = g; rect(cx - pz.w / 2, y, pz.w, pz.h, 10); ctx.fill();
    // glaseado que gotea
    ctx.fillStyle = i ? '#fff' : '#fff4f8';
    ctx.beginPath(); ctx.moveTo(cx - pz.w / 2, y + 6);
    const n = 9;
    for (let k = 0; k <= n; k++) {
      const x = cx - pz.w / 2 + pz.w * k / n, gota = 10 + ((k * 37) % 13);
      ctx.quadraticCurveTo(x - pz.w / n / 2, y + gota + 6, x, y + 8);
    }
    ctx.lineTo(cx + pz.w / 2, y); ctx.lineTo(cx - pz.w / 2, y); ctx.fill();
    // confites
    for (let k = 0; k < 12; k++) {
      ctx.fillStyle = ['#ffd36b', '#6ad1ff', '#9dff8a', '#c69cff'][k % 4];
      const sx = cx - pz.w / 2 + 12 + ((k * 53) % (pz.w - 24)), sy = y + 26 + ((k * 29) % (pz.h - 32));
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(k); ctx.fillRect(-4, -1.5, 8, 3); ctx.restore();
    }
  });
  ctx.restore();
  return { cx, top: y + sube, ancho: pisos[1].w };
}

function dibujarVelas(t, pz) {
  const pv = clamp((t - T_VELAS) / 600);
  if (pv <= 0) return [];
  const n = CONFIG.velas, sep = Math.min(30, (pz.ancho - 30) / n), llamas = [];
  for (let i = 0; i < n; i++) {
    const x = pz.cx + (i - (n - 1) / 2) * sep, h = 40 * easeOut(clamp(pv * n - i * .6));
    const y = pz.top - h;
    ctx.fillStyle = ['#6ad1ff', '#ffd36b', '#ff8fb8', '#9dff8a', '#c69cff'][i % 5];
    ctx.fillRect(x - 4, y, 8, h);
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    for (let s = 6; s < h; s += 10) ctx.fillRect(x - 4, y + s, 8, 3);
    llamas.push({ x, y: y - 2 });
  }
  return llamas;
}

function dibujarLlamas(t, llamas) {
  for (const [i, l] of llamas.entries()) {
    const apagado = apagadas[i] == null ? 0 : clamp((t - apagadas[i]) / 350);
    const vacila = 1 + Math.sin(t / 90 + i * 1.7) * .08 + Math.sin(t / 37 + i) * .05;
    const s = (1 - apagado) * vacila * (1 - Math.min(viento, 1) * .25), inclina = Math.sin(t / 200 + i) * 2 + viento * 14 + apagado * 10;
    if (s > .02) {
      const halo = ctx.createRadialGradient(l.x, l.y - 10, 0, l.x, l.y - 10, 40 * s);
      halo.addColorStop(0, 'rgba(255,200,90,.45)'); halo.addColorStop(1, 'rgba(255,200,90,0)');
      ctx.fillStyle = halo; ctx.fillRect(l.x - 45, l.y - 55, 90, 90);
      ctx.save(); ctx.translate(l.x, l.y); ctx.scale(s, s);
      const g = ctx.createRadialGradient(0, -6, 1, 0, -8, 14);
      g.addColorStop(0, '#fff8d0'); g.addColorStop(.5, '#ffc93c'); g.addColorStop(1, 'rgba(255,110,40,.0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, 2);
      ctx.bezierCurveTo(-8, -4, -5 + inclina, -14, inclina, -24);
      ctx.bezierCurveTo(5 + inclina, -14, 8, -4, 0, 2); ctx.fill();
      ctx.restore();
    }
  }
}

const apagadas = [];
let viento = 0, energia = 0, encendidas = () => CONFIG.velas - apagadas.filter(v => v != null).length;
function apagarAlgunas(k, t) {
  const libres = [...Array(CONFIG.velas).keys()].filter(i => apagadas[i] == null);
  for (let j = 0; j < k && libres.length; j++) {
    const i = libres.splice((Math.random() * libres.length) | 0, 1)[0]; apagadas[i] = t;
    for (let h = 0; h < 8; h++) humo.push({ k: i, n: t + Math.random() * 300, vx: Math.random() * .6 + .2, f: Math.random() * 6 });
  }
  K.vibrar(20);
  if (!encendidas()) soplar(t + 200);
}
function puff(t) {        // un toque = un soplido: inclina las llamas y apaga un tercio
  if (tSoplo !== null || t < T_VELAS + 600) return;
  viento = 1.2; apagarAlgunas(Math.ceil(CONFIG.velas / 3), t);
}
function soplar(t) {
  if (tSoplo !== null || t < T_VELAS + 600) return;
  tSoplo = t; $('mic').classList.remove('ver'); $('nivel').classList.remove('ver'); pararMic();
  setTimeout(() => { soltarGlobos(); const g = $('pistaG'); g.textContent = TXG.globos; g.style.opacity = 1; setTimeout(() => g.style.opacity = 0, 4500); }, 2400);
  $('pista').classList.remove('visible'); $('pista').style.opacity = 0;
  for (let i = 0; i < 40; i++) humo.push({ k: i % CONFIG.velas, n: t + Math.random() * 300, vx: Math.random() * .6 + .2, f: Math.random() * 6 });
  for (let i = 0; i < 180; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.6, v = 4 + Math.random() * 8;
    confeti.push({ x: W / 2, y: H * .42, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: ['#ffd36b', '#6ad1ff', '#ff8fb8', '#9dff8a', '#c69cff'][i % 5], r: Math.random() * 6, n: t, vida: 2600 + Math.random() * 1400 });
  }
}
document.body.addEventListener('pointerdown', e => {
  if (VIDEO || e.target.closest('button')) return;
  const o = $('onda'); o.style.left = e.clientX + 'px'; o.style.top = e.clientY + 'px';
  o.animate([{ opacity: .9, transform: 'scale(.4)' }, { opacity: 0, transform: 'scale(2.6)' }], { duration: 500, easing: 'ease-out' });
  if (tSoplo === null) puff(ahora); else reventar(e.clientX, e.clientY);
});

const vel = 45;
function escribir(el, txt, ini, now) {
  const p = clamp((now - ini) / (txt.length * vel));
  el.textContent = txt.slice(0, Math.round(p * txt.length));
  el.classList.toggle('typing', p > 0 && p < 1);
}

let llamasPrev = [];
function frame(now) {
  if (t0 === null) t0 = now;
  const t = ahora = now - t0;
  const oscuro = tSoplo === null ? 1 : 1 - .35 * clamp((t - tSoplo) / 600);

  ctx.fillStyle = '#140a1f'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (const l of luces) {     // luces desenfocadas (bokeh)
    const a = (.05 + .04 * Math.sin(t / 900 + l.f)) * (tSoplo === null ? .7 : 1.2);
    const g = ctx.createRadialGradient(l.x * W, l.y * H, 0, l.x * W, l.y * H, l.r);
    g.addColorStop(0, `hsla(${l.h},90%,65%,${a})`); g.addColorStop(1, `hsla(${l.h},90%,65%,0)`);
    ctx.fillStyle = g; ctx.fillRect(l.x * W - l.r, l.y * H - l.r, l.r * 2, l.r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';

  const pz = dibujarPastel(t);
  const llamas = dibujarVelas(t, pz);
  if (llamas.length) llamasPrev = llamas;
  viento *= .94; dibujarLlamas(t, llamas);
  escucharMic(t);

  // humito tras soplar
  for (const h of humo) {
    const e = t - h.n; if (e < 0 || e > 1600 || !llamasPrev[h.k]) continue;
    const l = llamasPrev[h.k], p = e / 1600;
    ctx.fillStyle = `rgba(220,220,235,${.35 * (1 - p)})`;
    ctx.beginPath(); ctx.arc(l.x + Math.sin(e / 200 + h.f) * 8 + e * h.vx * .03, l.y - 10 - e * .06, 3 + p * 9, 0, 7); ctx.fill();
  }
  // confeti
  for (const c of confeti) {
    const e = t - c.n; if (e > c.vida) continue;
    const k = e / 16.67;
    const x = c.x + c.vx * k * 1.2 + Math.sin(e / 250 + c.r) * 12, y = c.y + c.vy * k * 1.2 + .5 * .12 * k * k;
    ctx.save(); ctx.translate(x, y); ctx.rotate(e / 160 + c.r); ctx.globalAlpha = 1 - e / c.vida;
    ctx.fillStyle = c.c; ctx.fillRect(-5, -2.5, 10, 5); ctx.restore();
  }
  // chispitas de fondo después del soplo
  if (tSoplo !== null) for (const s of chispas) {
    const a = clamp((t - tSoplo - 400) / 800) * (.5 + .5 * Math.sin(t / 220 + s.f));
    ctx.fillStyle = `rgba(255,230,160,${a * .8})`; ctx.beginPath(); ctx.arc(s.x * W, s.y * H * .55, 1.4, 0, 7); ctx.fill();
  }

  if (t > T_NOMBRE) { $('feliz').classList.add('visible'); $('para').classList.add('visible'); }
  if (tSoplo === null && t > T_PISTA) $('pista').classList.add('visible');
  pintarGlobos(t);
  guion(t);
  if (tSoplo !== null) {
    const T_MSG = tSoplo + 1200, T_FIRMA = T_MSG + CONFIG.mensaje.length * vel + 400;
    escribir($('msg'), CONFIG.mensaje, T_MSG, t);
    escribir($('firma'), CONFIG.firma, T_FIRMA, t);
    if (t > T_FIRMA + CONFIG.firma.length * vel + 400) $('repetir').classList.add('visible');
  }
  if (tSoplo === null && t > T_PISTA && !VIDEO && !micActivo && !micNegado) $('mic').classList.add('ver');
  requestAnimationFrame(frame);
}
setTimeout(() => requestAnimationFrame(frame), 250);
if (EN) { const r = document.getElementById('repetir'); if (r && r.dataset.en) r.textContent = r.dataset.en; document.documentElement.lang = 'en'; }
</script>
