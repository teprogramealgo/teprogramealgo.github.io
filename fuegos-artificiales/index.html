<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 Te programé algo</title>
<!-- AI Romantic Code · Pieza #007 · Fuegos artificiales que forman su nombre -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #03040d; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .texto { position: fixed; left: 0; right: 0; bottom: 11vh; text-align: center; padding: 0 26px; color: #fff4e0; font-family: 'Quicksand', sans-serif; }
  #msg { font-size: clamp(16px, 4.4vw, 21px); line-height: 1.55; min-height: 3.2em; text-shadow: 0 0 12px rgba(255,190,90,.55); }
  #firma { font-family: 'Dancing Script', cursive; font-weight: 700; font-size: clamp(22px, 6.0vw, 31px); color: #ffd36b; margin-top: 10px; min-height: 1.3em; }
  .typing::after { content: '|'; margin-left: 2px; color: #ffd36b; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #repetir { position: fixed; bottom: 14px; right: 14px; background: rgba(255,211,107,.12); border: 1px solid rgba(255,211,107,.45);
    color: #ffd36b; font: 14px 'Quicksand', sans-serif; padding: 8px 14px; border-radius: 20px; cursor: pointer; opacity: 0; transition: opacity 1s; }
  #repetir.visible { opacity: 1; }
</style>

<!-- Seguridad: solo recursos propios + Google Fonts; nada puede enviar datos a otros sitios -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Vista previa para WhatsApp / redes (Te programé algo) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="@teprogramealgo">
<meta property="og:title" content="💌 Te programé algo">
<meta property="og:description" content="Alguien preparó esto especialmente para ti. Ábrelo 💛">
<meta property="og:url" content="https://teprogramealgo.github.io/fuegos-artificiales/">
<meta property="og:image" content="https://teprogramealgo.github.io/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Alguien preparó esto especialmente para ti. Ábrelo 💛">
<meta name="theme-color" content="#0D0F1A">
<link rel="icon" href="../logo.svg">
</head>
<body>
<canvas id="fondo"></canvas>
<canvas id="fx"></canvas>
<div class="texto"><div id="msg"></div><div id="firma"></div></div>
<button id="repetir" data-no-video onclick="location.reload()">↻ Ver de nuevo</button>
<script>
/* ✏️ PERSONALIZA AQUÍ — o por el link: ?para=Ana&msg=...&de=... */
const q = new URLSearchParams(location.search);
const CONFIG = {
  para:    q.get('para') || "Daniela",
  mensaje: q.get('msg')  || "Que este año nuevo tenga tantos momentos contigo como luces en este cielo.",
  firma:   q.get('de')   || "Feliz año, mi amor ✨"
};

const fondo = document.getElementById('fondo'), bg = fondo.getContext('2d');
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let W, H, DPR;
const COLORES = [[255, 92, 154], [255, 211, 107], [120, 200, 255], [190, 130, 255], [120, 255, 190], [255, 140, 90]];
const azar = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);

/* Cielo, estrellas y ciudad (se dibujan una vez) */
const estrellas = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random() * .75, r: Math.random() * 1.2 + .2 }));
const edificios = [];
for (let x = 0; x < 1;) { const w = azar(.04, .09); edificios.push({ x, w, h: azar(.05, .16) }); x += w; }
function medir() {
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  for (const c of [fondo, cv]) { c.width = W * DPR; c.height = H * DPR; }
  bg.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = bg.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#03040d'); g.addColorStop(.7, '#0b1030'); g.addColorStop(1, '#1a1440');
  bg.fillStyle = g; bg.fillRect(0, 0, W, H);
  for (const s of estrellas) { bg.fillStyle = `rgba(255,255,255,${.3 + s.r * .4})`; bg.beginPath(); bg.arc(s.x * W, s.y * H, s.r, 0, 7); bg.fill(); }
  bg.fillStyle = '#05060f';
  for (const e of edificios) {
    bg.fillRect(e.x * W, H - e.h * H, e.w * W + 1, e.h * H);
    bg.fillStyle = 'rgba(255,211,107,.35)';
    for (let wy = H - e.h * H + 8; wy < H - 6; wy += 11) for (let wx = e.x * W + 5; wx < (e.x + e.w) * W - 5; wx += 9)
      if (Math.random() > .62) bg.fillRect(wx, wy, 3, 4);
    bg.fillStyle = '#05060f';
  }
}
medir(); addEventListener('resize', medir);

/* Puntos del nombre: se dibuja el texto en un lienzo oculto y se muestrean los píxeles */
function puntosNombre() {
  const off = document.createElement('canvas'), o = off.getContext('2d');
  off.width = W; off.height = H;
  let fs = Math.min(W * .2, 120);
  o.font = `700 ${fs}px 'Dancing Script', cursive`;
  const ancho = o.measureText(CONFIG.para).width;
  if (ancho > W * .88) { fs *= W * .88 / ancho; o.font = `700 ${fs}px 'Dancing Script', cursive`; }
  o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
  o.fillText(CONFIG.para, W / 2, H * .36);
  const d = o.getImageData(0, 0, W, H).data, pts = [];
  const paso = Math.max(2, Math.round(fs / 34));
  for (let y = 0; y < H; y += paso) for (let x = 0; x < W; x += paso) if (d[(y * W + x) * 4 + 3] > 140) pts.push({ x, y });
  // máximo ~1400 partículas
  while (pts.length > 1400) pts.splice((Math.random() * pts.length) | 0, 1);
  return pts;
}

const cohetes = [], chispas = [], letras = [];
function lanzar(t, x, yObjetivo, grande = false) {
  cohetes.push({ x, y: H + 10, x0: x, y0: H + 10, ty: yObjetivo, n: t, dur: grande ? 900 : azar(650, 900), grande, col: COLORES[(Math.random() * COLORES.length) | 0] });
}
function estallar(c, t) {
  const n = c.grande ? 160 : 90;
  for (let i = 0; i < n; i++) {
    const a = Math.PI * 2 * i / n + azar(-.05, .05), v = azar(1.2, 3.4) * (c.grande ? 1.4 : 1);
    chispas.push({ x: c.x, y: c.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, n: t, vida: azar(900, 1500), col: Math.random() > .25 ? c.col : [255, 255, 255] });
  }
}

const T_GRANDE = 3900, T_ESTALLA = T_GRANDE + 900, T_FORMA = 1500;
const T_MSG = T_ESTALLA + T_FORMA + 300, vel = 45;
const T_FIRMA = T_MSG + CONFIG.mensaje.length * vel + 400;
const T_FIN = T_FIRMA + CONFIG.firma.length * vel + 400;
const PROGRAMA = [300, 1000, 1600, 2300, 2900, 3400];   // fuegos de apertura
let siguiente = 0, ultimoFondo = 0, granLanzado = false, nombreListo = false;
const elMsg = document.getElementById('msg'), elFirma = document.getElementById('firma');

function escribir(el, txt, t0, now) {
  const p = clamp((now - t0) / (txt.length * vel));
  el.textContent = txt.slice(0, Math.round(p * txt.length));
  el.classList.toggle('typing', p > 0 && p < 1);
}

let t0 = null, tPrev = 0;
function frame(now) {
  if (t0 === null) t0 = now;
  const t = now - t0, dt = Math.min(50, t - tPrev) / 16.67; tPrev = t;

  // estela: borra suavemente lo anterior
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  while (siguiente < PROGRAMA.length && t >= PROGRAMA[siguiente]) { lanzar(t, azar(W * .15, W * .85), azar(H * .15, H * .45)); siguiente++; }
  if (!granLanzado && t >= T_GRANDE) { granLanzado = true; lanzar(t, W / 2, H * .36, true); }
  if (t > T_ESTALLA + 900 && t - ultimoFondo > 1100) {            // fuegos suaves de fondo
    ultimoFondo = t; lanzar(t, Math.random() > .5 ? azar(W * .05, W * .3) : azar(W * .7, W * .95), azar(H * .08, H * .22));
  }

  for (let i = cohetes.length - 1; i >= 0; i--) {
    const c = cohetes[i], p = clamp((t - c.n) / c.dur);
    c.y = c.y0 + (c.ty - c.y0) * easeOut(p); c.x = c.x0 + Math.sin(p * 6) * 3;
    ctx.fillStyle = `rgba(255,230,180,.9)`; ctx.beginPath(); ctx.arc(c.x, c.y, c.grande ? 3 : 2, 0, 7); ctx.fill();
    if (p >= 1) {
      cohetes.splice(i, 1);
      if (c.grande) iniciarNombre(t, c); else estallar(c, t);
    }
  }

  for (let i = chispas.length - 1; i >= 0; i--) {
    const s = chispas[i], e = (t - s.n) / s.vida;
    if (e >= 1) { chispas.splice(i, 1); continue; }
    s.vx *= Math.pow(.975, dt); s.vy = s.vy * Math.pow(.975, dt) + .035 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    ctx.fillStyle = `rgba(${s.col[0]},${s.col[1]},${s.col[2]},${1 - e})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, 1.6 * (1 - e * .5), 0, 7); ctx.fill();
  }

  // el nombre: las chispas viajan del estallido a su letra y se quedan titilando
  for (const l of letras) {
    const p = clamp((t - l.n) / T_FORMA);
    const a = easeInOut(p);
    // primero salen disparadas, luego se acomodan
    const sx = l.ox + l.vx * 60 * easeOut(clamp(p * 2.2)), sy = l.oy + l.vy * 60 * easeOut(clamp(p * 2.2));
    const x = sx + (l.x - sx) * a, y = sy + (l.y - sy) * a;
    const tit = p >= 1 ? .65 + .35 * Math.sin(t / 260 + l.f) : 1;
    ctx.fillStyle = `rgba(${l.col[0]},${l.col[1]},${l.col[2]},${tit})`;
    ctx.beginPath(); ctx.arc(x, y, p >= 1 ? 1.5 : 1.9, 0, 7); ctx.fill();
  }

  escribir(elMsg, CONFIG.mensaje, T_MSG, t);
  escribir(elFirma, CONFIG.firma, T_FIRMA, t);
  if (t > T_FIN) document.getElementById('repetir').classList.add('visible');
  requestAnimationFrame(frame);
}

let PUNTOS = [];
function iniciarNombre(t, c) {
  for (const p of PUNTOS) {
    const a = Math.random() * Math.PI * 2, v = azar(.5, 2.6);
    const oro = Math.random() > .35;
    letras.push({ x: p.x, y: p.y, ox: c.x, oy: c.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, n: t, f: Math.random() * 6,
      col: oro ? [255, 214, 120] : [255, 120, 170] });
  }
  estallar({ ...c, grande: false, col: [255, 214, 120] }, t);
}

// Espera la fuente antes de muestrear el nombre (si no, sale con letra genérica)
document.fonts.load(`700 80px 'Dancing Script'`).catch(() => {}).then(() => {
  PUNTOS = puntosNombre();
  setTimeout(() => requestAnimationFrame(frame), 200);
});
</script>
</body>
