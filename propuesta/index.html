<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💌 Te programé algo</title>
<!-- AI Romantic Code · Pieza #009 · Propuesta con botón NO que se escapa -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 35%, #3a0f2e 0%, #1a0716 60%, #0d0410 100%); }
  body { font-family: 'Quicksand', sans-serif; color: #ffe6f0; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #caja { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); width: min(88vw, 420px); text-align: center; }
  #corazon { width: 96px; height: 96px; margin: 0 auto 18px; animation: latir 1.2s ease-in-out infinite; filter: drop-shadow(0 0 18px rgba(255,77,141,.7)); }
  @keyframes latir { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.12); } 28% { transform: scale(1.02); } 42% { transform: scale(1.1); } }
  #para { font-family: 'Dancing Script', cursive; font-weight: 700; font-size: clamp(34px, 10.2vw, 49px); color: #fff; text-shadow: 0 0 18px rgba(255,92,154,.75); line-height: 1.1; }
  #pregunta { font-size: clamp(22px, 6.4vw, 30px); font-weight: 700; margin-top: 8px; line-height: 1.3; }
  #nota { font-size: clamp(14px, 3.8vw, 17px); color: #ff9cc2; margin-top: 12px; min-height: 1.5em; }
  .btn { position: fixed; border: 0; border-radius: 999px; font: 700 20px 'Quicksand', sans-serif; padding: 14px 34px; cursor: pointer; }
  #si { background: linear-gradient(135deg, #ff4d8d, #ff7aa8); color: #fff; box-shadow: 0 8px 26px rgba(255,77,141,.45); transform-origin: center; }
  #no { background: #f2e9ee; color: #7a3a55; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  #final { position: fixed; left: 0; right: 0; top: 62vh; text-align: center; padding: 0 26px; opacity: 0; transition: opacity 1s; }
  #final.visible { opacity: 1; }
  #sabia { font-size: clamp(22px, 6vw, 28px); font-weight: 700; color: #fff; }
  #msg { font-size: clamp(15px, 4.2vw, 19px); line-height: 1.55; margin-top: 12px; min-height: 3.2em; }
  #firma { font-family: 'Dancing Script', cursive; font-weight: 700; font-size: clamp(22px, 6.0vw, 29px); color: #ff8fb8; margin-top: 6px; min-height: 1.3em; }
  .typing::after { content: '|'; margin-left: 2px; color: #ff4d8d; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #cursor { position: fixed; left: 0; top: 0; width: 34px; height: 34px; pointer-events: none; opacity: 0; z-index: 10; transition: opacity .3s;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  #onda { position: fixed; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 3px solid #fff; pointer-events: none; opacity: 0; z-index: 9; }
  #repetir { position: fixed; bottom: 14px; right: 14px; background: rgba(255,77,141,.12); border: 1px solid rgba(255,77,141,.45);
    color: #ff8fb8; font: 14px 'Quicksand', sans-serif; padding: 8px 14px; border-radius: 20px; cursor: pointer; opacity: 0; transition: opacity 1s; }
  #repetir.visible { opacity: 1; }
</style>

<!-- Seguridad: solo recursos propios + Google Fonts; nada puede enviar datos a otros sitios -->

<meta property="og:url" content="https://teprogramealgo.github.io/propuesta/">
<meta property="og:image" content="https://teprogramealgo.github.io/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Alguien preparó esto especialmente para ti. Ábrelo 💛">

</head>
<body>
<canvas id="c"></canvas>
<div id="caja">
  <svg id="corazon" viewBox="0 0 100 90"><path fill="#ff4d8d" d="M50 88 C20 66 0 48 0 26 0 11 12 0 27 0 37 0 45 5 50 13 55 5 63 0 73 0 88 0 100 11 100 26 100 48 80 66 50 88Z"/></svg>
  <div id="para"></div>
  <div id="pregunta"></div>
  <div id="nota"></div>
</div>
<button class="btn" id="si">Sí 💖</button>
<button class="btn" id="no">No</button>
<div id="final"><div id="sabia">¡Sabía que dirías que sí! 💖</div><div id="msg"></div><div id="firma"></div></div>
<svg id="cursor" viewBox="0 0 24 24"><path fill="#fff" stroke="#000" stroke-width="1.2" d="M5 2 L5 20 L9.5 15.5 L12.5 22 L15.5 20.7 L12.6 14.3 L19 14.3 Z"/></svg>
<div id="onda"></div>
<button id="repetir" data-no-video onclick="location.reload()">↻ Ver de nuevo</button>
<script>
/* ✏️ PERSONALIZA AQUÍ — o por el link: ?para=Ana&pregunta=...&msg=...&de=... */
const q = new URLSearchParams(location.search);
const CONFIG = {
  para:     q.get('para')     || "Andrea",
  pregunta: q.get('pregunta') || "¿quieres ser mi novia?",
  mensaje:  q.get('msg')      || "Prometo hacerte reír todos los días y quererte más cada uno de ellos.",
  firma:    q.get('de')       || "Tu ahora novio, Sebastián"
};
const VIDEO = q.has('video');          // en el video, un cursor simula a la persona
const EXCUSAS = ["¿Segura? 🥺", "Piénsalo bien…", "Ese botón no funciona 😌", "Mejor el otro 💖", "No tienes opción 😇"];

const $ = id => document.getElementById(id);
$('para').textContent = CONFIG.para + ',';
$('pregunta').textContent = CONFIG.pregunta;
const si = $('si'), no = $('no'), cursor = $('cursor'), onda = $('onda');
const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* Botones: Sí fijo (crece con cada intento), No con posición animada por JS */
let W, H, escala = 1, intentos = 0, aceptado = false;
const noPos = { x: 0, y: 0, tx: 0, ty: 0 };
function ubicar() {
  W = innerWidth; H = innerHeight;
  const y = H * .62;
  si.style.left = (W / 2 - si.offsetWidth - 10) + 'px'; si.style.top = y + 'px';
  if (!intentos) { noPos.x = noPos.tx = W / 2 + 10; noPos.y = noPos.ty = y; }
}
ubicar(); addEventListener('resize', ubicar);

function huir() {
  if (aceptado) return;
  intentos++;
  $('nota').textContent = EXCUSAS[Math.min(intentos - 1, EXCUSAS.length - 1)];
  const r = si.getBoundingClientRect(), bw = no.offsetWidth, bh = no.offsetHeight;
  for (let k = 0; k < 30; k++) {           // busca un lugar lejos del puntero y sin tapar el Sí
    const x = 16 + Math.random() * (W - bw - 32), y = H * .12 + Math.random() * (H * .8 - bh);
    const chocaSi = x < r.right + 12 && x + bw > r.left - 12 && y < r.bottom + 12 && y + bh > r.top - 12;
    const lejos = Math.hypot(x - noPos.x, y - noPos.y) > Math.min(W, H) * .3;
    if (!chocaSi && lejos) { noPos.tx = x; noPos.ty = y; break; }
  }
  escala = Math.min(1.6, 1 + intentos * .14);
  no.style.transform = `scale(${Math.max(.55, 1 - intentos * .1)})`;
}
no.addEventListener('pointerenter', huir);
no.addEventListener('pointerdown', e => { e.preventDefault(); huir(); });
no.addEventListener('click', e => e.preventDefault());

/* Celebración */
const cv = $('c'), ctx = cv.getContext('2d');
function medir() { const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
medir(); addEventListener('resize', medir);
const confeti = [];
let tSi = null;
function aceptar(t) {
  if (aceptado) return;
  aceptado = true; tSi = t;
  const r = si.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 7;
    confeti.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, s: 7 + Math.random() * 12, r: Math.random() * 6, h: 320 + Math.random() * 40, vida: 2200 + Math.random() * 1600 });
  }
  $('nota').textContent = '';
  no.style.opacity = 0; no.style.pointerEvents = 'none';
  si.style.transition = 'opacity .6s'; si.style.opacity = 0;
  $('caja').style.transition = 'top 1s'; $('caja').style.top = '30%';
  $('final').classList.add('visible');
}
si.addEventListener('click', () => aceptar(ahora));

function corazonPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .3);
  ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3);
  ctx.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s);
  ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
  ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3); ctx.fill();
}

/* Guion del cursor en el video: [inicio, fin, destino] */
const centro = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width * .55, y: r.top + r.height * .6 }; };
const GUION = [
  { a: 1500, b: 2300, ir: () => centro(no), luego: huir },
  { a: 2600, b: 3300, ir: () => ({ x: noPos.tx + no.offsetWidth * .5, y: noPos.ty + no.offsetHeight * .6 }), luego: huir },
  { a: 3600, b: 4250, ir: () => ({ x: noPos.tx + no.offsetWidth * .5, y: noPos.ty + no.offsetHeight * .6 }), luego: huir },
  { a: 4700, b: 5500, ir: () => centro(si), luego: () => { clic(); aceptar(ahora); } },
];
const cur = { x: 0, y: 0, de: null, a: null };
function clic() { onda.animate([{ opacity: .9, transform: 'scale(.4)' }, { opacity: 0, transform: 'scale(2.6)' }], { duration: 500, easing: 'ease-out' }); }

const vel = 45;
let t0 = null, ahora = 0, paso = 0;
function escribir(el, txt, ini, now) {
  const p = clamp((now - ini) / (txt.length * vel));
  el.textContent = txt.slice(0, Math.round(p * txt.length));
  el.classList.toggle('typing', p > 0 && p < 1);
}

function frame(now) {
  if (t0 === null) { t0 = now; cur.x = W * .85; cur.y = H * .92; }
  const t = ahora = now - t0;

  // botón No viaja suave hacia su nuevo lugar
  noPos.x += (noPos.tx - noPos.x) * .22; noPos.y += (noPos.ty - noPos.y) * .22;
  no.style.left = noPos.x + 'px'; no.style.top = noPos.y + 'px';
  si.style.transform = `scale(${escala})`;

  if (VIDEO && paso < GUION.length) {
    const s = GUION[paso];
    if (t >= s.a) {
      cursor.style.opacity = 1;
      if (!cur.de) { cur.de = { x: cur.x, y: cur.y }; cur.a = s.ir(); }
      const p = easeInOut(clamp((t - s.a) / (s.b - s.a)));
      cur.x = cur.de.x + (cur.a.x - cur.de.x) * p; cur.y = cur.de.y + (cur.a.y - cur.de.y) * p;
      if (t >= s.b) { s.luego(); cur.de = null; paso++; }
    }
  }
  if (VIDEO && aceptado && t > tSi + 900) cursor.style.opacity = 0;
  cursor.style.transform = `translate(${cur.x - 6}px, ${cur.y - 3}px)`;
  onda.style.left = cur.x + 'px'; onda.style.top = cur.y + 'px';

  ctx.clearRect(0, 0, innerWidth, innerHeight);
  if (aceptado) {
    for (const c of confeti) {
      const e = t - tSi; if (e > c.vida) continue;
      const k = e / 16.67;
      const x = c.x + c.vx * k * 1.6 + Math.sin(e / 300 + c.r) * 10;
      const y = c.y + c.vy * k * 1.6 + .5 * .09 * k * k;
      ctx.fillStyle = `hsla(${c.h},95%,68%,${1 - e / c.vida})`;
      corazonPath(x, y, c.s);
    }
    const T_MSG = tSi + 1300, T_FIRMA = T_MSG + CONFIG.mensaje.length * vel + 400;
    escribir($('msg'), CONFIG.mensaje, T_MSG, t);
    escribir($('firma'), CONFIG.firma, T_FIRMA, t);
    if (t > T_FIRMA + CONFIG.firma.length * vel + 400) $('repetir').classList.add('visible');
  }
  requestAnimationFrame(frame);
}
setTimeout(() => requestAnimationFrame(frame), 250);
</script>
</body>
</html>
