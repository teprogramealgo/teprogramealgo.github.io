<!-- AI Romantic Code · Pieza #006 · Terminal: responde la pregunta secreta para descifrar el mensaje -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #020805; overflow: hidden; }
  body { font-family: 'JetBrains Mono', monospace; color: #7dffa8; -webkit-tap-highlight-color: transparent; --acento: #7dffa8; --pista: #b8ffd0; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #ventana { position: fixed; left: 50%; top: 4vh; width: min(92vw, 420px); transform: translateX(-50%); z-index: 2; border-radius: 12px; overflow: hidden;
    background: rgba(2,14,8,.88); border: 1px solid rgba(125,255,168,.35); box-shadow: 0 0 40px rgba(60,255,140,.18), 0 20px 50px rgba(0,0,0,.6); transition: border-color 1s, box-shadow 1s; }
  #ventana.ok { border-color: rgba(255,120,170,.6); box-shadow: 0 0 50px rgba(255,80,150,.35), 0 20px 50px rgba(0,0,0,.6); }
  .barra { display: flex; gap: 6px; padding: 9px 12px; background: rgba(125,255,168,.08); border-bottom: 1px solid rgba(125,255,168,.15); font-size: 11px; color: #4fbf78; align-items: center; }
  .barra i { width: 10px; height: 10px; border-radius: 50%; display: block; } .barra span { margin-left: 8px; }
  #term { padding: 12px 14px 14px; font-size: clamp(12px, 3.4vw, 14px); line-height: 1.6; min-height: 120px; max-height: 46vh; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dim { color: #3f9c62; } .ok { color: #b8ffd0; font-weight: 700; } .mal { color: #ff6b81; font-weight: 700; } .rosa { color: #ff8fb8; } .preg { color: #ffe27a; font-weight: 700; }
  #fila { display: none; align-items: center; gap: 8px; padding: 0 14px 14px; }
  #fila.ver { display: flex; }
  #fila b { color: #ff8fb8; }
  #resp { flex: 1; min-width: 0; background: rgba(125,255,168,.06); border: 1px solid rgba(125,255,168,.35); border-radius: 8px; color: #fff; font: 700 16px 'JetBrains Mono', monospace;
    padding: 10px 12px; outline: none; caret-color: #7dffa8; }
  #resp:focus { border-color: #7dffa8; box-shadow: 0 0 0 3px rgba(125,255,168,.15); }
  #enviar { background: #7dffa8; color: #02140a; border: 0; border-radius: 8px; font: 800 15px 'JetBrains Mono', monospace; padding: 10px 14px; cursor: pointer; }
  #ventana.tiembla { animation: tiembla .45s; }
  @keyframes tiembla { 20%, 60% { transform: translateX(calc(-50% - 8px)); } 40%, 80% { transform: translateX(calc(-50% + 8px)); } }
  #acceso { position: fixed; left: 0; right: 0; top: 40vh; text-align: center; z-index: 3; font: 800 clamp(26px, 8vw, 40px) 'JetBrains Mono', monospace; color: #b8ffd0;
    text-shadow: 0 0 20px #3dff8a, 0 0 50px #3dff8a; opacity: 0; pointer-events: none; }
  #acceso.ver { animation: flash 1.6s forwards; }
  @keyframes flash { 0% { opacity: 0; transform: scale(1.4); } 12% { opacity: 1; transform: scale(1); } 20% { opacity: .2; } 28%, 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
  #revela { position: fixed; left: 50%; bottom: 7vh; width: min(92vw, 420px); transform: translateX(-50%); z-index: 2; text-align: center; opacity: 0; transition: opacity .8s; }
  #revela.ver { opacity: 1; }
  #corazon { font: 700 9px/9px 'JetBrains Mono', monospace; color: #ff4d8d; white-space: pre; text-shadow: 0 0 10px #ff4d8d; display: inline-block; }
  #corazon.late { animation: latir 1.1s ease-in-out infinite; }
  @keyframes latir { 0%,100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.06); } }
  #nombre { font: 700 clamp(30px, 9vw, 42px) 'Dancing Script', cursive; color: #fff; text-shadow: 0 0 16px rgba(255,120,180,.8); margin-top: 6px; overflow-wrap: anywhere; }
  #msg { font-size: clamp(13px, 3.7vw, 15px); line-height: 1.6; color: #ffe4ef; margin-top: 8px; min-height: 3em; overflow-wrap: anywhere; }
  #firma { font-size: 13px; color: #ff8fb8; margin-top: 8px; min-height: 1.3em; }
</style>

<body>
<canvas id="c"></canvas>
<div id="ventana">
  <div class="barra"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span id="titulo">corazon.sh</span></div>
  <div id="term"></div>
  <div id="fila"><b>&gt;</b><input id="resp" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60" enterkeyhint="send"><button id="enviar" type="button">↵</button></div>
</div>
<div id="acceso"></div>
<div id="revela"><div id="corazon"></div><div id="nombre"></div><div id="msg"></div><div id="firma"></div></div>
<div id="pista"></div>
<button id="repetir" data-no-video onclick="location.reload()" data-en="↻ watch again">↻ ver de nuevo</button>
<script>
/* ✏️ PERSONALIZA AQUÍ — o por el link: ?para=Ana&pregunta=¿Dónde nos conocimos?&clave=en la playa&ayuda=empieza con p&msg=...&de=... */
const q = new URLSearchParams(location.search);
const EN = q.get('lang') === 'en';   // ?lang=en → textos en inglés (cuenta de TikTok en inglés)
const CONFIG = {
  para:     q.get('para') || (EN ? "Mia" : "Lucía"),
  mensaje:  q.get('msg')  || (EN ? "I tried to encrypt what I feel for you, but no algorithm can hide it. I'm crazy about you." : "Intenté cifrar lo que siento por ti, pero no existe algoritmo capaz de esconderlo. Me encantas."),
  firma:    q.get('de')   || (EN ? "— root, who loves you" : "— root, que te quiere"),
  pregunta: q.get('pregunta') || '',
  clave:    q.get('clave') || '',
  ayuda:    q.get('ayuda') || ''
};
if (!CONFIG.pregunta || !CONFIG.clave) { CONFIG.pregunta = EN ? 'Identity check: type your name' : 'Verificación de identidad: escribe tu nombre'; CONFIG.clave = CONFIG.para; }
const TX = EN ? {
  l1: ['$ ', './decrypt --for ', null], l2: '[ok] secure connection established', l3: n => `[..] locating ${n}'s heart`, l4: '[ok] found ♥ (beating fast)',
  l5: '[!!] message locked 🔒', preg: '? ', mal: n => `ACCESS DENIED ✕  (attempt ${n}/3)`, ayuda: 'hint: ', rendir: "fine… I'll let you in anyway, because it's you 😌",
  acceso: 'ACCESS GRANTED', dec: '[..] decrypting message', pista: 'Type your answer and press ↵ ⌨️', prompt: 'root@love:~'
} : {
  l1: ['$ ', './descifrar --para ', null], l2: '[ok] conexión segura establecida', l3: n => `[..] buscando el corazón de ${n}`, l4: '[ok] encontrado ♥ (estaba latiendo fuerte)',
  l5: '[!!] mensaje bloqueado 🔒', preg: '? ', mal: n => `ACCESO DENEGADO ✕  (intento ${n}/3)`, ayuda: 'pista: ', rendir: 'bueno… te dejo pasar igual, porque eres tú 😌',
  acceso: 'ACCESO CONCEDIDO', dec: '[..] descifrando mensaje', pista: 'Escribe tu respuesta y toca ↵ ⌨️', prompt: 'root@amor:~'
};
const { clamp, rnd } = K;
const L = K.lienzo('c'), ctx = L.ctx;
const $ = id => document.getElementById(id);
const term = $('term'), inp = $('resp'), fila = $('fila');
$('titulo').textContent = TX.prompt;
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9ñ ]/g, '').replace(/\s+/g, ' ').trim();

/* ---------- terminal: líneas que se escriben (siempre con textContent) ---------- */
const cola = []; let escribiendo = false;
function linea(partes, vel = 16) { return new Promise(r => { cola.push({ partes, vel, fin: r }); if (!escribiendo) siguiente(); }); }
function siguiente() {
  const l = cola.shift(); if (!l) { escribiendo = false; return; }
  escribiendo = true;
  const div = document.createElement('div'); term.appendChild(div);
  const spans = l.partes.map(([cls, txt]) => { const s = document.createElement('span'); if (cls) s.className = cls; div.appendChild(s); return [s, txt]; });
  let i = 0, j = 0;
  (function paso() {
    if (i >= spans.length) { while (term.scrollHeight > term.clientHeight && term.children.length > 1) term.removeChild(term.firstChild); l.fin && l.fin(); siguiente(); return; }
    const [s, txt] = spans[i];
    s.textContent = txt.slice(0, ++j);
    if (j >= txt.length) { i++; j = 0; }
    setTimeout(paso, l.vel);
  })();
}
const espera = ms => new Promise(r => setTimeout(r, ms));

let intentos = 0, fase = 'arranque', tOk = -1, t = 0;
async function arrancar() {
  await espera(400);
  await linea([['dim', TX.prompt + TX.l1[0]], ['', TX.l1[1] + '"' + CONFIG.para + '"']], 30);
  await espera(300); await linea([['ok', TX.l2]]);
  await linea([['dim', TX.l3(CONFIG.para)]]); await espera(400);
  await linea([['ok', TX.l4.replace('♥', '')], ['rosa', '']]);
  await linea([['mal', TX.l5]]); await espera(300);
  await linea([['preg', TX.preg + CONFIG.pregunta]], 22);
  fase = 'pregunta'; fila.classList.add('ver'); K.pista($('pista'), TX.pista);
  if (!K.VIDEO) setTimeout(() => inp.focus(), 100);
}
async function responder() {
  if (fase !== 'pregunta') return;
  const v = inp.value.trim(); if (!v) { inp.focus(); return; }
  inp.value = '';
  await linea([['dim', '> '], ['', v]], 8);
  if (norm(v) === norm(CONFIG.clave) || (norm(CONFIG.clave).length > 3 && norm(v).includes(norm(CONFIG.clave)))) return concedido();
  intentos++; K.vibrar([60, 40, 60]);
  $('ventana').classList.remove('tiembla'); void $('ventana').offsetWidth; $('ventana').classList.add('tiembla');
  if (intentos >= 3) { fase = 'x'; await linea([['mal', TX.mal(intentos)]]); await linea([['rosa', TX.rendir]], 26); return concedido(); }
  await linea([['mal', TX.mal(intentos)]]);
  if (CONFIG.ayuda && intentos >= 1) await linea([['preg', TX.ayuda + CONFIG.ayuda]]);
  if (!K.VIDEO) inp.focus();
}
async function concedido() {
  fase = 'ok'; fila.classList.remove('ver'); inp.blur(); K.pista($('pista'), ''); K.vibrar([40, 60, 40, 60, 150]);
  const a = $('acceso'); a.textContent = TX.acceso; a.classList.add('ver');
  $('ventana').classList.add('ok');
  await espera(1200); await linea([['dim', TX.dec]]);
  tOk = t;
  $('corazon').textContent = [' ███   ███ ', '█████ █████', '███████████', ' █████████ ', '  ███████  ', '   █████   ', '    ███    ', '     █     '].join('\n');
  $('nombre').textContent = CONFIG.para;
  $('revela').classList.add('ver'); setTimeout(() => $('corazon').classList.add('late'), 600);
}
$('enviar').addEventListener('click', responder);
inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); responder(); } });

// mensaje que se «descifra»: caracteres al azar que se van fijando
const GLIFOS = '01#$%&*+<>/\\|{}[]=?!ABCDEFabcdef';
function descifrar(el, txt, t0, dur) {
  const p = clamp((t - t0) / dur); if (p <= 0) { el.textContent = ''; return false; }
  const fijos = Math.floor(p * txt.length), visibles = Math.min(txt.length, fijos + 6);
  let s = txt.slice(0, fijos);
  for (let i = fijos; i < visibles; i++) s += txt[i] === ' ' ? ' ' : GLIFOS[(Math.random() * GLIFOS.length) | 0];
  el.textContent = s; return p >= 1;
}

// video: el cursor toca el campo, «escribe» la respuesta y envía
const MAL = EN ? 'babe?' : '¿mi amor?';
const escribirEn = txt => { let i = 0; (function tecla() { if (i > txt.length) return; inp.value = txt.slice(0, i++); setTimeout(tecla, 130); })(); };
const enInput = () => { const r = inp.getBoundingClientRect(); return { x: r.left + 40, y: r.top + r.height / 2 }; };
const enBoton = () => { const r = $('enviar').getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
const guion = K.guion([
  { cuando: () => fase === 'pregunta' ? t + 300 : null, donde: enInput },
  { cuando: () => inp.value === MAL ? t + 350 : null, donde: enBoton },
  { cuando: () => fase === 'pregunta' && intentos === 1 && !escribiendo ? t + 700 : null, donde: enInput },
  { cuando: () => fase === 'pregunta' && inp.value === CONFIG.clave ? t + 400 : null, donde: enBoton }
], {
  abajo: (x, y) => {
    if (document.elementFromPoint(x, y) === $('enviar')) return responder();
    inp.style.borderColor = '#7dffa8'; escribirEn(intentos === 0 ? MAL : CONFIG.clave);
  }
});

/* ---------- lluvia de código ---------- */
const COL = 16; let gotas = [];
function prepararLluvia() { gotas = Array.from({ length: Math.ceil(L.W / COL) }, () => ({ y: rnd(-L.H, 0), v: rnd(2, 5) })); }
prepararLluvia(); addEventListener('resize', prepararLluvia);
let t0 = null, ultimo = 0;
function frame(now) {
  if (t0 === null) t0 = now;
  t = now - t0;
  if (t - ultimo > 45) {
    ultimo = t;
    const ok = tOk > 0;
    ctx.fillStyle = 'rgba(2,8,5,.16)'; ctx.fillRect(0, 0, L.W, L.H);
    ctx.font = `700 ${COL - 2}px 'JetBrains Mono', monospace`;
    gotas.forEach((g, i) => {
      const c = ok && Math.random() < .25 ? '♥' : GLIFOS[(Math.random() * GLIFOS.length) | 0];
      ctx.fillStyle = ok ? (Math.random() < .5 ? '#ff4d8d' : '#ff9cc2') : (Math.random() < .1 ? '#d8ffe6' : '#1f9e55');
      ctx.globalAlpha = .55; ctx.fillText(c, i * COL, g.y); ctx.globalAlpha = 1;
      g.y += COL; if (g.y > L.H + rnd(0, 400)) g.y = rnd(-100, 0);
    });
  }
  if (tOk > 0) {
    const tm = tOk + 900, dur = CONFIG.mensaje.length * 38;
    if (descifrar($('msg'), CONFIG.mensaje, tm, dur) && K.escribir($('firma'), CONFIG.firma, tm + dur + 400, t, 45) && t > tm + dur + 400 + CONFIG.firma.length * 45 + 700) K.repetir();
  }
  guion(t);
  requestAnimationFrame(frame);
}
document.fonts.ready.then(() => { requestAnimationFrame(frame); arrancar(); });
K.traducirRepetir();
</script>
