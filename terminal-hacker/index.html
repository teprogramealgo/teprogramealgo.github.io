<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 Te programé algo</title>
<!-- AI Romantic Code · Pieza #006 · Terminal que descifra una declaración -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #030806; overflow: hidden; }
  body { color: #39ff88; font-family: 'JetBrains Mono', monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .22; }
  .crt { position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px),
                radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.75) 100%); }
  #term { position: fixed; left: 0; right: 0; top: 7vh; padding: 0 22px; font-size: clamp(12px, 3.5vw, 16px); line-height: 1.75;
    text-shadow: 0 0 8px rgba(57,255,136,.55); }
  #term .dim { color: #1f9e57; }
  #term .ok { color: #b6ffd3; }
  #term .rosa { color: #ff5c9a; text-shadow: 0 0 8px rgba(255,92,154,.6); }
  .cursor::after { content: '█'; margin-left: 1px; animation: blink .7s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #panel { position: fixed; left: 50%; top: 52%; width: min(88vw, 460px); transform: translate(-50%, -50%) scale(.9);
    border: 1px solid rgba(57,255,136,.55); border-radius: 10px; padding: 22px 20px 20px; text-align: center;
    background: rgba(2,14,8,.86); box-shadow: 0 0 40px rgba(57,255,136,.18), inset 0 0 30px rgba(57,255,136,.06);
    opacity: 0; transition: opacity .5s, transform .6s cubic-bezier(.2,1.4,.4,1); }
  #panel.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #acceso { font-weight: 800; letter-spacing: .18em; font-size: clamp(15px, 4.6vw, 20px); color: #39ff88; }
  #corazon { color: #ff4d8d; font-size: clamp(9px, 2.6vw, 12px); line-height: 1.05; white-space: pre; margin: 14px 0 6px;
    text-shadow: 0 0 10px rgba(255,77,141,.8); display: inline-block; }
  #corazon.late { animation: latir 1.1s ease-in-out infinite; }
  @keyframes latir { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.09); } 26% { transform: scale(1.02); } 38% { transform: scale(1.07); } }
  #para { font-family: 'Dancing Script', cursive; font-weight: 700; font-size: clamp(29px, 8.5vw, 41px); color: #fff; text-shadow: 0 0 16px rgba(255,92,154,.8); min-height: 1.2em; }
  #msg { color: #d8ffe8; font-size: clamp(13px, 3.8vw, 16px); line-height: 1.6; margin-top: 10px; min-height: 3.2em; }
  #firma { color: #ff8fb8; font-size: clamp(13px, 3.8vw, 16px); margin-top: 12px; min-height: 1.4em; font-weight: 700; }
  #repetir { position: fixed; bottom: 14px; right: 14px; background: rgba(57,255,136,.1); border: 1px solid rgba(57,255,136,.45);
    color: #39ff88; font: 13px 'JetBrains Mono', monospace; padding: 8px 14px; border-radius: 6px; cursor: pointer; opacity: 0; transition: opacity 1s; }
  #repetir.visible { opacity: 1; }
</style>

<!-- Seguridad: solo recursos propios + Google Fonts; nada puede enviar datos a otros sitios -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Vista previa para WhatsApp / redes (Te programé algo) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="@teprogramealgo">
<meta property="og:title" content="💌 Te programé algo">
<meta property="og:description" content="Alguien preparó esto especialmente para ti. Ábrelo 💛">
<meta property="og:url" content="https://teprogramealgo.github.io/terminal-hacker/">
<meta property="og:image" content="https://teprogramealgo.github.io/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Alguien preparó esto especialmente para ti. Ábrelo 💛">
<meta name="theme-color" content="#0D0F1A">
<link rel="icon" href="../logo.svg">
</head>
<body>
<canvas id="lluvia"></canvas>
<div id="term"></div>
<div id="panel">
  <div id="acceso">ACCESO CONCEDIDO</div>
  <div id="corazon"></div>
  <div id="para"></div>
  <div id="msg"></div>
  <div id="firma"></div>
</div>
<div class="crt"></div>
<button id="repetir" data-no-video onclick="location.reload()">↻ ver de nuevo</button>
<script>
/* ✏️ PERSONALIZA AQUÍ — o por el link: ?para=Ana&msg=...&de=... */
const q = new URLSearchParams(location.search);
const CONFIG = {
  para:    q.get('para') || "Lucía",
  mensaje: q.get('msg')  || "Intenté cifrar lo que siento por ti, pero no existe algoritmo capaz de esconderlo. Me encantas.",
  firma:   q.get('de')   || "— root, que te quiere"
};

/* Lluvia de código de fondo */
const cv = document.getElementById('lluvia'), ctx = cv.getContext('2d');
let W, H, cols, gotas;
function medir() {
  const dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cols = Math.ceil(W / 16); gotas = Array.from({ length: cols }, () => Math.random() * -H / 16);
}
medir(); addEventListener('resize', medir);
const GLIFOS = '01<>{}[]/*=+;:#$%&アイウエオカキクケコ♥';
const azar = s => s[(Math.random() * s.length) | 0];

/* Guion de la terminal: [inicio ms, html de la línea, ms por letra (0 = de golpe), barra de progreso] */
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nombre = esc(CONFIG.para);
const LINEAS = [
  { t: 300,  txt: `<span class="dim">root@amor:~$</span> ./descifrar --para "${nombre}"`, vel: 28 },
  { t: 1900, txt: `<span class="ok">[ok]</span> conexión segura establecida` },
  { t: 2200, txt: `<span class="dim">[..]</span> buscando el corazón de ${nombre}`, barra: [2300, 3500] },
  { t: 3650, txt: `<span class="ok">[ok]</span> encontrado <span class="rosa">♥</span> (estaba latiendo fuerte)` },
  { t: 3950, txt: `<span class="dim">[..]</span> descifrando mensaje`, barra: [4050, 5000] },
];
const T_PANEL = 5250, T_PARA = 5600, T_MSG = 6300, vel = 38;
const T_FIRMA = T_MSG + CONFIG.mensaje.length * vel + 350;
const T_FIN = T_FIRMA + CONFIG.firma.length * 45 + 300;

const CORAZON = [
  "  ♥♥♥♥     ♥♥♥♥  ",
  " ♥♥♥♥♥♥   ♥♥♥♥♥♥ ",
  "♥♥♥♥♥♥♥♥ ♥♥♥♥♥♥♥♥",
  "♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥",
  " ♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥ ",
  "   ♥♥♥♥♥♥♥♥♥♥♥   ",
  "     ♥♥♥♥♥♥♥     ",
  "       ♥♥♥       ",
  "        ♥        "
];

/* Corta HTML a n letras visibles (sin romper etiquetas) */
function cortarHTML(html, n) {
  let out = '', vis = 0, i = 0;
  while (i < html.length && vis < n) {
    if (html[i] === '<') { const j = html.indexOf('>', i); out += html.slice(i, j + 1); i = j + 1; continue; }
    if (html[i] === '&') { const j = html.indexOf(';', i); out += html.slice(i, j + 1); i = j + 1; vis++; continue; }
    out += html[i++]; vis++;
  }
  // cierra spans abiertos
  const abiertos = (out.match(/<span/g) || []).length - (out.match(/<\/span>/g) || []).length;
  return out + '</span>'.repeat(Math.max(0, abiertos));
}
const visibles = html => html.replace(/<[^>]+>/g, '').replace(/&[^;]+;/g, 'x').length;

function barra(p) {
  const n = 16, llenos = Math.round(p * n);
  return ` <span class="ok">[${'█'.repeat(llenos)}${'░'.repeat(n - llenos)}]</span> ${String(Math.round(p * 100)).padStart(3)}%`;
}

/* Efecto descifrado: las letras ya "resueltas" son reales, las siguientes cambian al azar */
function descifrar(txt, t0, now, v) {
  const p = (now - t0) / v;
  if (p <= 0) return '';
  const fijas = Math.min(txt.length, Math.floor(p));
  let s = txt.slice(0, fijas);
  const ruido = Math.min(txt.length - fijas, 6);
  for (let i = 0; i < ruido; i++) s += txt[fijas + i] === ' ' ? ' ' : azar('01#$%&*<>/\\{}');
  return esc(s);
}

const elTerm = document.getElementById('term'), panel = document.getElementById('panel');
const elCor = document.getElementById('corazon'), elPara = document.getElementById('para');
const elMsg = document.getElementById('msg'), elFirma = document.getElementById('firma');
let t0 = null, ultimaLluvia = 0;

function frame(now) {
  if (t0 === null) t0 = now;
  const t = now - t0;

  // lluvia (cada ~50 ms)
  if (now - ultimaLluvia > 50) {
    ultimaLluvia = now;
    ctx.fillStyle = 'rgba(3,8,6,.18)'; ctx.fillRect(0, 0, W, H);
    ctx.font = '14px JetBrains Mono, monospace'; ctx.fillStyle = '#39ff88';
    for (let i = 0; i < cols; i++) {
      ctx.fillText(azar(GLIFOS), i * 16, gotas[i] * 16);
      if (gotas[i] * 16 > H && Math.random() > 0.975) gotas[i] = 0;
      gotas[i] += 1;
    }
  }

  // terminal
  let html = '';
  for (let i = 0; i < LINEAS.length; i++) {
    const L = LINEAS[i];
    if (t < L.t) break;
    const total = visibles(L.txt);
    const n = L.vel ? Math.min(total, Math.floor((t - L.t) / L.vel)) : total;
    let linea = cortarHTML(L.txt, n);
    if (L.barra && t >= L.barra[0]) linea += barra(Math.min(1, (t - L.barra[0]) / (L.barra[1] - L.barra[0])));
    const ultima = i === LINEAS.length - 1 || t < LINEAS[i + 1].t;
    html += `<div class="${ultima && t < T_PANEL ? 'cursor' : ''}">${linea}</div>`;
  }
  elTerm.innerHTML = html;
  elTerm.style.opacity = t > T_PANEL ? Math.max(0.25, 1 - (t - T_PANEL) / 800) : 1;

  // panel final
  if (t > T_PANEL && !panel.classList.contains('visible')) {
    panel.classList.add('visible');
    elCor.textContent = CORAZON.join('\n');
    elCor.classList.add('late');
  }
  if (t > T_PANEL) {
    // el corazón aparece fila por fila
    const filas = Math.min(CORAZON.length, Math.floor((t - T_PANEL) / 45));
    elCor.textContent = CORAZON.map((f, i) => i < filas ? f : ' '.repeat(f.length)).join('\n');
  }
  elPara.innerHTML = t > T_PARA ? descifrar(CONFIG.para, T_PARA, t, 70) : '';
  elMsg.innerHTML = descifrar(CONFIG.mensaje, T_MSG, t, vel);
  elFirma.innerHTML = descifrar(CONFIG.firma, T_FIRMA, t, 45);
  if (t > T_FIN) document.getElementById('repetir').classList.add('visible');
  requestAnimationFrame(frame);
}
ctx.fillStyle = '#030806'; ctx.fillRect(0, 0, W, H);
setTimeout(() => requestAnimationFrame(frame), 250);
</script>
</body>
</html>
