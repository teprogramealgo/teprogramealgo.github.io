<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 Te programé algo</title>
<!-- AI Romantic Code · Pieza #002 · Corazón de partículas -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #07020a; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .texto { position: fixed; left: 0; right: 0; bottom: 9vh; text-align: center; padding: 0 26px; color: #ffe4ec; font-family: 'Quicksand', sans-serif; }
  #msg { font-size: clamp(16px, 4.4vw, 21px); line-height: 1.55; min-height: 3.2em; text-shadow: 0 0 12px rgba(255, 60, 120, .5); }
  #firma { font-family: 'Great Vibes', cursive; font-size: clamp(26px, 7vw, 36px); color: #ff8fb1; margin-top: 10px; min-height: 1.3em; }
  .typing::after { content: '|'; margin-left: 2px; color: #ff4d8d; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #repetir { position: fixed; bottom: 14px; right: 14px; background: rgba(255,77,141,.12); border: 1px solid rgba(255,77,141,.45);
    color: #ff8fb1; font: 14px 'Quicksand', sans-serif; padding: 8px 14px; border-radius: 20px; cursor: pointer; opacity: 0; transition: opacity 1s; }
  #repetir.visible { opacity: 1; }
</style>

<!-- Seguridad: solo recursos propios + Google Fonts; nada puede enviar datos a otros sitios -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Vista previa para WhatsApp / redes (Te programé algo) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="@teprogramealgo">
<meta property="og:title" content="💌 Te programé algo">
<meta property="og:description" content="Alguien preparó esto especialmente para ti. Ábrelo 💛">
<meta property="og:url" content="https://teprogramealgo.github.io/corazon-particulas/">
<meta property="og:image" content="https://teprogramealgo.github.io/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Alguien preparó esto especialmente para ti. Ábrelo 💛">
<meta name="theme-color" content="#0D0F1A">
<link rel="icon" href="../logo.svg">
</head>
<body>
<canvas id="c"></canvas>
<div class="texto"><div id="msg"></div><div id="firma"></div></div>
<button id="repetir" data-no-video onclick="location.reload()">↻ Ver de nuevo</button>
<script>
/* ✏️ PERSONALIZA AQUÍ — o por el link: ?para=Ana&msg=...&de=... */
const q = new URLSearchParams(location.search);
const CONFIG = {
  para:    q.get('para') || "Valeria",
  mensaje: q.get('msg')  || "Cada latido de este corazón lleva tu nombre. Gracias por existir.",
  firma:   q.get('de')   || "Tuyo siempre ❤️",
  particulas: 900
};

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function medir() { DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
medir(); addEventListener('resize', medir);

const easeOut = t => 1 - Math.pow(1 - t, 3);
const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);

// Puntos del corazón (curva clásica) — relleno con algo de profundidad
function puntoCorazon(t, k) {
  return { x: 16 * Math.pow(Math.sin(t), 3) * k, y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * k };
}
const P = [];
for (let i = 0; i < CONFIG.particulas; i++) {
  const t = Math.random() * Math.PI * 2;
  const capa = i < CONFIG.particulas * 0.65 ? 1 : 0.35 + Math.random() * 0.6;   // borde + interior
  const ang = Math.random() * Math.PI * 2, rad = Math.max(W, H) * (0.6 + Math.random() * 0.4);
  P.push({
    t, capa,
    ox: Math.cos(ang) * rad, oy: Math.sin(ang) * rad,     // origen fuera de pantalla
    j: (Math.random() - 0.5) * 0.9,                       // jitter
    delay: 400 + Math.random() * 1800,
    size: 0.8 + Math.random() * 1.8,
    hue: 330 + Math.random() * 30
  });
}
// corazoncitos que suben
const flotantes = [];

function corazonPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
  ctx.fill();
}

const T_LATIDO = 3000, T_NOMBRE = 3300, T_MSG = 4600;
const vel = 45;
const T_FIRMA = T_MSG + CONFIG.mensaje.length * vel + 400;
const T_FIN = T_FIRMA + CONFIG.firma.length * vel + 400;
const elMsg = document.getElementById('msg'), elFirma = document.getElementById('firma');

function escribir(el, txt, t0, now) {
  const p = clamp((now - t0) / (txt.length * vel));
  el.textContent = txt.slice(0, Math.round(p * txt.length));
  el.classList.toggle('typing', p > 0 && p < 1);
}

let t0 = null, ultimoFlot = 0;
function frame(now) {
  if (t0 === null) t0 = now;
  const t = now - t0;
  const cx = W / 2, cy = H * 0.36;
  const k = Math.min(W, H) / 40;

  ctx.fillStyle = 'rgba(7,2,10,0.32)';           // estela
  ctx.fillRect(0, 0, W, H);

  // latido: doble pulso cada 1.1 s
  let lat = 1;
  if (t > T_LATIDO) {
    const f = ((t - T_LATIDO) % 1100) / 1100;
    lat = 1 + 0.07 * Math.exp(-Math.pow((f - 0.08) * 18, 2)) + 0.045 * Math.exp(-Math.pow((f - 0.28) * 18, 2));
  }

  // halo
  const brillo = clamp((t - 2200) / 1500) * (0.55 + (lat - 1) * 4);
  if (brillo > 0) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, k * 22);
    g.addColorStop(0, `rgba(255,40,110,${0.28 * brillo})`); g.addColorStop(1, 'rgba(255,40,110,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const p of P) {
    const a = easeOut(clamp((t - p.delay) / 1400));
    if (a <= 0) continue;
    const h = puntoCorazon(p.t, k * p.capa * lat);
    const wob = Math.sin(t / 380 + p.t * 7) * p.j * k * 0.25;
    const x = cx + p.ox + (h.x + wob - p.ox) * a;
    const y = cy + p.oy + (h.y + wob - p.oy) * a;
    ctx.fillStyle = `hsla(${p.hue},100%,${60 + p.capa * 12}%,${0.35 + 0.65 * a})`;
    ctx.beginPath(); ctx.arc(x, y, p.size * (0.6 + 0.4 * lat), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // nombre dentro del corazón
  const an = clamp((t - T_NOMBRE) / 900);
  if (an > 0) {
    const fs = Math.min(W * 0.13, 64) * lat;
    ctx.save();
    ctx.globalAlpha = an;
    ctx.font = `${fs}px 'Great Vibes', cursive`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,120,170,.9)'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#fff';
    ctx.fillText(CONFIG.para, cx, cy - k * 1.5 + (1 - easeOut(an)) * 20);
    ctx.restore();
  }

  // corazoncitos flotantes
  if (t > T_LATIDO && t - ultimoFlot > 260) {
    ultimoFlot = t;
    flotantes.push({ x: Math.random() * W, y: H + 20, s: 8 + Math.random() * 14, v: 0.6 + Math.random() * 0.9, n: t, f: Math.random() * 6 });
  }
  for (let i = flotantes.length - 1; i >= 0; i--) {
    const f = flotantes[i];
    const e = t - f.n;
    const y = f.y - e * f.v * 0.09;
    if (y < -40) { flotantes.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(255,${90 + (f.s * 4) | 0},150,${0.35})`;
    corazonPath(f.x + Math.sin(e / 500 + f.f) * 14, y, f.s);
  }

  escribir(elMsg, CONFIG.mensaje, T_MSG, t);
  escribir(elFirma, CONFIG.firma, T_FIRMA, t);
  if (t > T_FIN) document.getElementById('repetir').classList.add('visible');
  requestAnimationFrame(frame);
}
ctx.fillStyle = '#07020a'; ctx.fillRect(0, 0, W, H);
setTimeout(() => requestAnimationFrame(frame), 300);
</script>
</body>
</html>
