<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 Te programé algo</title>
<!-- AI Romantic Code · Pieza #008 · Árbol de luces con nieve -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #050b1a; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .texto { position: fixed; left: 0; right: 0; top: 60vh; text-align: center; padding: 0 26px; color: #f4f7ff; font-family: 'Quicksand', sans-serif; }
  #titulo { font-family: 'Dancing Script', cursive; font-weight: 700; font-size: clamp(29px, 8.5vw, 42px); color: #ffd76a; text-shadow: 0 0 18px rgba(255,200,90,.6);
    opacity: 0; transform: translateY(12px); transition: opacity 1.2s, transform 1.2s; min-height: 1.2em; }
  #titulo.visible { opacity: 1; transform: none; }
  #msg { font-size: clamp(15px, 4.2vw, 20px); line-height: 1.55; min-height: 3.2em; margin-top: 8px; text-shadow: 0 0 10px rgba(140,180,255,.5); }
  #firma { font-family: 'Dancing Script', cursive; font-weight: 700; font-size: clamp(22px, 6.0vw, 29px); color: #ff8f9a; margin-top: 8px; min-height: 1.3em; }
  .typing::after { content: '|'; margin-left: 2px; color: #ffd76a; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #repetir { position: fixed; bottom: 14px; right: 14px; background: rgba(255,215,106,.12); border: 1px solid rgba(255,215,106,.45);
    color: #ffd76a; font: 14px 'Quicksand', sans-serif; padding: 8px 14px; border-radius: 20px; cursor: pointer; opacity: 0; transition: opacity 1s; }
  #repetir.visible { opacity: 1; }
</style>

<!-- Seguridad: solo recursos propios + Google Fonts; nada puede enviar datos a otros sitios -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Vista previa para WhatsApp / redes (Te programé algo) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="@teprogramealgo">
<meta property="og:title" content="💌 Te programé algo">
<meta property="og:description" content="Alguien preparó esto especialmente para ti. Ábrelo 💛">
<meta property="og:url" content="https://teprogramealgo.github.io/navidad/">
<meta property="og:image" content="https://teprogramealgo.github.io/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Alguien preparó esto especialmente para ti. Ábrelo 💛">
<meta name="theme-color" content="#0D0F1A">
<link rel="icon" href="../logo.svg">
</head>
<body>
<canvas id="c"></canvas>
<div class="texto"><div id="titulo"></div><div id="msg"></div><div id="firma"></div></div>
<button id="repetir" data-no-video onclick="location.reload()" data-en="↻ Watch again">↻ Ver de nuevo</button>
<script>
/* ✏️ PERSONALIZA AQUÍ — o por el link: ?para=Ana&msg=...&de=...&saludo=... */
const q = new URLSearchParams(location.search);
const EN = q.get('lang') === 'en';   // ?lang=en → textos en inglés (cuenta de TikTok en inglés)
const CONFIG = {
  para:    q.get('para')   || (EN ? "Lily" : "Valentina"),
  saludo:  q.get('saludo') || (EN ? "Merry Christmas" : "Feliz Navidad"),
  mensaje: q.get('msg')    || (EN ? "My favorite gift doesn't fit under the tree: it's you. Thank you for filling this year with light." : "Mi regalo favorito no cabe debajo del árbol: eres tú. Gracias por llenar de luz este año."),
  firma:   q.get('de')     || (EN ? "Love, Matthew 🎄" : "Con amor, Mateo 🎄")
};

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H;
function medir() { const d = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
medir(); addEventListener('resize', medir);
const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);
const easeOut = t => 1 - Math.pow(1 - t, 3);

const nieve = Array.from({ length: 170 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 2.2 + .6, v: Math.random() * .4 + .25, f: Math.random() * 6 }));
const COLORES = ['#ff4d6d', '#ffd76a', '#6ad1ff', '#9dff8a', '#ff9de2', '#ffffff'];
// Luces de la guirnalda: espiral alrededor de un cono
const N = 220, VUELTAS = 6.5;
const luces = Array.from({ length: N }, (_, i) => ({ u: i / (N - 1), col: COLORES[i % COLORES.length], f: Math.random() * 6 }));
const adornos = Array.from({ length: 14 }, () => ({ u: .15 + Math.random() * .8, a: Math.random() * Math.PI * 2, col: COLORES[(Math.random() * 5) | 0] }));

const T_ARBOL = 300, D_ARBOL = 2600, T_ESTRELLA = T_ARBOL + D_ARBOL, T_TITULO = T_ESTRELLA + 500, T_MSG = T_TITULO + 1100, vel = 45;
const T_FIRMA = T_MSG + CONFIG.mensaje.length * vel + 400;
const T_FIN = T_FIRMA + CONFIG.firma.length * vel + 400;
const elT = document.getElementById('titulo'), elMsg = document.getElementById('msg'), elFirma = document.getElementById('firma');
elT.textContent = `${CONFIG.saludo}, ${CONFIG.para}`;

function escribir(el, txt, t0, now) {
  const p = clamp((now - t0) / (txt.length * vel));
  el.textContent = txt.slice(0, Math.round(p * txt.length));
  el.classList.toggle('typing', p > 0 && p < 1);
}
function estrella(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}

let t0 = null;
function frame(now) {
  if (t0 === null) t0 = now;
  const t = now - t0;
  const cx = W / 2, top = H * .1, base = H * .5, ancho = Math.min(W * .42, (base - top) * .62);

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#050b1a'); g.addColorStop(.6, '#0d1a3a'); g.addColorStop(1, '#16264d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // suelo nevado
  const gs = ctx.createLinearGradient(0, base - 4, 0, base + 70);
  gs.addColorStop(0, 'rgba(225,234,255,.95)'); gs.addColorStop(.35, 'rgba(150,175,230,.45)'); gs.addColorStop(1, 'rgba(22,38,77,0)');
  ctx.fillStyle = gs;
  ctx.beginPath(); ctx.moveTo(0, base + 22); ctx.quadraticCurveTo(cx, base - 4, W, base + 22); ctx.lineTo(W, base + 70); ctx.lineTo(0, base + 70); ctx.fill();

  // tronco y silueta suave del árbol
  const pa = easeOut(clamp((t - T_ARBOL) / D_ARBOL));
  ctx.fillStyle = '#3b2414'; ctx.fillRect(cx - 9, base - 2, 18, 22);
  ctx.globalAlpha = .35 * clamp((t - T_ARBOL) / 600);
  const gv = ctx.createLinearGradient(0, top, 0, base);
  gv.addColorStop(0, '#1f6b45'); gv.addColorStop(1, '#0b3a25');
  ctx.fillStyle = gv;
  ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx + ancho, base); ctx.lineTo(cx - ancho, base); ctx.fill();
  ctx.globalAlpha = 1;

  // guirnalda que se enrolla de arriba hacia abajo
  const visibles = Math.floor(pa * N);
  const pos = l => {
    const a = l.u * VUELTAS * Math.PI * 2 + t / 2400;
    const r = ancho * l.u;
    return { x: cx + Math.cos(a) * r, y: top + (base - top) * l.u + Math.sin(a) * r * .12, frente: Math.sin(a) };
  };
  // cable
  ctx.strokeStyle = 'rgba(160,220,170,.25)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < visibles; i++) { const p = pos(luces[i]); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < visibles; i++) {
    const l = luces[i], p = pos(l);
    const brillo = (.55 + .45 * Math.sin(t / 300 + l.f)) * (p.frente > 0 ? 1 : .35);
    ctx.globalAlpha = brillo;
    ctx.fillStyle = l.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.frente > 0 ? 2.6 : 1.6, 0, 7); ctx.fill();
    ctx.globalAlpha = brillo * .25;
    ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // esferas
  for (const b of adornos) {
    if (b.u > pa) continue;
    const a = b.a + t / 2400, r = ancho * b.u;
    if (Math.sin(a) < 0) continue;
    const x = cx + Math.cos(a) * r * .85, y = top + (base - top) * b.u + 6;
    const gb = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, 6);
    gb.addColorStop(0, '#fff'); gb.addColorStop(.3, b.col); gb.addColorStop(1, 'rgba(0,0,0,.4)');
    ctx.fillStyle = gb; ctx.beginPath(); ctx.arc(x, y, 5.5, 0, 7); ctx.fill();
  }

  // estrella
  const pe = easeOut(clamp((t - T_ESTRELLA) / 700));
  if (pe > 0) {
    const halo = ctx.createRadialGradient(cx, top - 4, 0, cx, top - 4, 70 * pe);
    halo.addColorStop(0, 'rgba(255,215,106,.55)'); halo.addColorStop(1, 'rgba(255,215,106,0)');
    ctx.fillStyle = halo; ctx.fillRect(cx - 80, top - 84, 160, 160);
    ctx.save(); ctx.translate(cx, top - 4); ctx.rotate(t / 2500);
    ctx.strokeStyle = `rgba(255,230,150,${.35 * pe})`; ctx.lineWidth = 1.2;
    for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -46 * pe); ctx.stroke(); ctx.rotate(Math.PI / 4); }
    ctx.restore();
    ctx.fillStyle = '#ffd76a'; estrella(cx, top - 4, 15 * pe, 0);
  }

  // nieve
  for (const s of nieve) {
    const y = ((s.y * H + t * s.v * .06) % (H + 10)) - 5;
    const x = (s.x * W + Math.sin(t / 1400 + s.f) * 18 + W) % W;
    ctx.fillStyle = `rgba(255,255,255,${.45 + s.r * .18})`;
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, 7); ctx.fill();
  }

  if (t > T_TITULO) elT.classList.add('visible');
  escribir(elMsg, CONFIG.mensaje, T_MSG, t);
  escribir(elFirma, CONFIG.firma, T_FIRMA, t);
  if (t > T_FIN) document.getElementById('repetir').classList.add('visible');
  requestAnimationFrame(frame);
}
setTimeout(() => requestAnimationFrame(frame), 250);
if (EN) { const r = document.getElementById('repetir'); if (r && r.dataset.en) r.textContent = r.dataset.en; document.documentElement.lang = 'en'; }
</script>
</body>
</html>
